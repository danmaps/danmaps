# README cards, see https://github.com/pedrocatalao/github-cool-readme
name: Update README cards

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN }}
          CONFIG: cool-readme.yml
          OUTPUT: ${{ runner.temp }}/cards
        run: |
          ACTION_DIR="$RUNNER_TEMP/github-cool-readme"
          git clone --quiet --depth 1 --branch v1 https://github.com/pedrocatalao/github-cool-readme.git "$ACTION_DIR"
          sed -i 's/!item\.repository/!item?.repository/g; s/!n\.repository/!n?.repository/g' "$ACTION_DIR/src/collect.ts"
          npm ci --omit=dev --no-audit --no-fund --prefix "$ACTION_DIR"
          args=(--out "$OUTPUT")
          if [ -f "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          node "$ACTION_DIR/src/cli.ts" "${args[@]}"
      # The cards live on their own branch, as a single commit replaced on each change, so they
      # don't add to the history of your main branch.
      - name: Publish the cards on the cards branch
        run: |
          git fetch --quiet --depth 1 origin cards:refs/remotes/origin/cards 2>/dev/null || true # not there on the first run
          git switch --quiet --orphan cards
          cp "$RUNNER_TEMP"/cards/*.svg .
          git add -- *.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'Update README cards'
          if git rev-parse --quiet --verify origin/cards >/dev/null && git diff --quiet origin/cards HEAD; then
            echo "No changes"
            exit 0
          fi
          git push --force origin cards
